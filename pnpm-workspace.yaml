allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: true
  workerd: true

overrides:
  # nuxt-csurf는 아직 h3 v1 이벤트 API를 사용합니다. 원본 템플릿의 고정을 유지합니다.
  h3: 1.15.11

savePrefix: ''

catalog:
  '@ag-ui/core': 1.0.2
  '@anthropic-ai/sdk': 0.134.0
  '@google/genai': 2.28.0
  '@types/node': 24.13.6
  '@standard-schema/spec': 1.1.0
  cordis: 4.0.0-rc.11
  openai: 7.15.0
  tsdown: 0.23.1
  typescript: 6.0.3
  vitest: 5.0.5
  zod: 4.6.7

packages:
  - apps/*
  - examples/*
  - packages/*
  - tools/*
