name: 개발 환경 준비
description: 프로젝트에 지정된 pnpm과 Node.js를 준비하고 의존성을 설치합니다.

inputs:
  turbo-cache:
    description: Turbo 작업 캐시를 복원하고 저장합니다.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # pnpm/setup은 cache: false여도 lockfile 검증 캐시를 저장하므로 병렬 job에서 충돌한다.
    - name: pnpm 설정
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: false # 내장 캐시의 중복 저장 경고를 피하기 위해 아래에서 저장할 job을 하나로 제한한다.
        run_install: false

    - name: Node.js 설정
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        package-manager-cache: false

    - name: pnpm 캐시 경로 확인
      id: pnpm-store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

    - name: pnpm 캐시 복원
      id: pnpm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-cache-${{ runner.os }}-${{ steps.pnpm-store.outputs.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-cache-${{ runner.os }}-${{ steps.pnpm-store.outputs.arch }}-

    - name: 의존성 설치
      shell: bash
      env:
        SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
      run: pnpm install --frozen-lockfile

    - name: pnpm 캐시 저장
      if: github.job == 'build' && steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

    - name: Turbo 캐시 설정
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'turbo.json') }}-
