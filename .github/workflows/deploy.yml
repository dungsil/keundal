name: 운영 배포

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: 운영 배포
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 운영 배포 대상 확인
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            if (branch.commit.sha !== run.head_sha) {
              core.info('main의 최신 커밋이 아니므로 배포를 생략합니다.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            if (!artifacts.some(artifact => artifact.name === 'cloudflare-workers' && !artifact.expired)) {
              core.info('웹 빌드가 없어 운영 배포를 생략합니다.');
              return;
            }
            core.setOutput('ready', 'true');

      - name: Workers 빌드 아티팩트 내려받기
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-workers
          path: worker
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Workers 운영 배포
        if: steps.source.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          workingDirectory: worker
          packageManager: npm
          command: deploy --config server/wrangler.json
