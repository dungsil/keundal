name: PR 프리뷰 종료

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  pull-requests: write

concurrency:
  # CI와 그룹을 공유하고 진행 중인 배포가 끝난 뒤 프리뷰를 삭제한다.
  group: CI-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup-preview:
    name: PR 프리뷰 종료
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR 코드를 실행하지 않고 프리뷰만 삭제한다. 이미 없는 프리뷰도 성공으로 처리한다.
      - name: Workers 프리뷰 삭제
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            if (!token || !account) {
              throw new Error('CLOUDFLARE_API_TOKEN과 CLOUDFLARE_ACCOUNT_ID가 필요합니다.');
            }
            const name = `pr-${context.payload.pull_request.number}`;
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/workers/workers/keundal-web/previews/${name}`,
              { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } }
            );
            const result = await response.json();
            if (response.ok && result.success) {
              core.info(`${name} 프리뷰와 배포 이력을 삭제했습니다.`);
            } else if (response.status === 404 && result.errors?.some(error => error.code === 10025)) {
              core.info(`${name} 프리뷰가 이미 없습니다.`);
            } else {
              throw new Error(`프리뷰 삭제 실패 (HTTP ${response.status})`);
            }

      - name: PR 프리뷰 종료 댓글 갱신
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cloudflare-preview
          only_update: true
          message: |
            ### Cloudflare Workers 프리뷰 종료

            PR이 병합되거나 닫혀 프리뷰와 배포 이력을 삭제했습니다.
