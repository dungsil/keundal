name: PR 프리뷰 종료

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  pull-requests: write

concurrency:
  # 프리뷰 배포와 그룹을 공유하고 대기 중인 삭제 요청도 보존한다.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  cleanup-preview:
    name: PR 프리뷰 종료
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR 종료 상태 재확인
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number
            });
            if (pr.state !== 'closed') {
              core.info('PR이 다시 열려 프리뷰 삭제를 생략합니다.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100
            });
            core.setOutput('web', comments.some(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes('<!-- Sticky Pull Request Commentcloudflare-preview -->')
            ));
            core.setOutput('ready', 'true');

      - name: Workers 프리뷰 삭제
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.web == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          packageManager: npm
          command: >-
            preview delete
            --name pr-${{ github.event.pull_request.number }}
            --worker-name keundal-web
            --skip-confirmation

      - name: PR 프리뷰 종료 댓글 갱신
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.web == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cloudflare-preview
          only_update: true
          message: |
            ### PR 프리뷰 종료

            PR이 병합되거나 닫혀 웹 프리뷰와 배포 이력을 삭제했습니다.
            데스크톱 설치 파일은 업로드 후 7일이 지나면 만료됩니다.

      - name: 데스크톱 프리뷰 종료 댓글 갱신
        if: steps.source.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: desktop-preview
          only_update: true
          message: |
            ### 데스크톱 프리뷰 종료

            PR이 병합되거나 닫혔습니다. 설치 파일은 업로드 후 7일이 지나면 만료됩니다.
