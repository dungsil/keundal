name: PR 프리뷰 종료

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  pull-requests: write

concurrency:
  # CI와 그룹을 공유하고 진행 중인 배포가 끝난 뒤 프리뷰를 삭제한다.
  group: CI-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup-preview:
    name: PR 프리뷰 종료
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Workers 프리뷰 삭제
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          packageManager: npm
          command: >-
            preview delete
            --name pr-${{ github.event.pull_request.number }}
            --worker-name keundal-web
            --skip-confirmation

      - name: PR 프리뷰 종료 댓글 갱신
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cloudflare-preview
          only_update: true
          message: |
            ### PR 프리뷰 종료

            PR이 병합되거나 닫혀 웹 프리뷰와 배포 이력을 삭제했습니다.
            데스크톱 설치 파일은 업로드 후 7일이 지나면 만료됩니다.
