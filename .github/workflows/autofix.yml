name: 자동수정

on:
  pull_request_target:
    branches: [main]
    types: [opened, labeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autofix:
    name: '자동 병합 활성화'
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.auto_merge == null &&
      contains(github.event.pull_request.labels.*.name, '유형:자동수정')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # 병합 조건은 Ruleset에서 관리하고, 여기서는 라벨에 따라 예약한다.
      - run: gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
