name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tools/**'
      - '!packages/**/*.md'
      - '!tools/**/*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 변경사항 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ github.event_name != 'pull_request' || steps.filter.outputs.source == 'true' }}
    steps:
      # PR은 경로 확인을 항상 실행하여 문서 변경도 필수 검사 결과를 남긴다.
      - name: 변경 경로 확인
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            source:
              - '{packages,tools}/**/!(*.md)'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - '.github/workflows/**'
              - '.github/actions/**'
      - name: 전체 검사 선택
        if: github.event_name != 'pull_request'
        run: echo '전체 검사를 실행합니다.'

  build:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 빌드
        run: pnpm build

  typecheck:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 타입 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 타입 검사에 필요한 패키지 빌드
        run: pnpm build

      - name: 타입 검사
        run: pnpm typecheck

  test:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 테스트
        run: pnpm test

  lint:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 린트 및 형식 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup

      - name: 린트 및 형식 검사
        id: lint
        run: pnpm lint

      - name: 린트 및 형식 자동수정
        id: lintfix
        if: >-
          failure() && steps.lint.outcome == 'failure' &&
          ((github.event_name != 'pull_request' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref == github.event.repository.default_branch &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft))
        run: pnpm lintfix

      - name: PR 브랜치에 자동수정 반영
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          contains(fromJSON('["success", "failure"]'), steps.lintfix.outcome)
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::AUTOFIX_TOKEN이 필요합니다. Dependabot PR에서는 Dependabot secret에 등록해야 합니다.'
            exit 1
          fi
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style: 코드 스타일을 통일한다'
          gh auth setup-git
          # CI 이후 브랜치가 변경되었다면 푸시를 거절한다.
          git push --force-with-lease="refs/heads/$PR_BRANCH:$SOURCE_SHA" origin "HEAD:refs/heads/$PR_BRANCH"

      - name: 수정 패치 생성
        id: patch
        if: >-
          !cancelled() && github.event_name != 'pull_request' &&
          contains(fromJSON('["success", "failure"]'), steps.lintfix.outcome)
        run: |
          git diff --binary --full-index > "$RUNNER_TEMP/autofix.patch"
          if [ -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: 수정 패치 업로드
        if: ${{ !cancelled() && steps.patch.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lintfix
          path: ${{ runner.temp }}/autofix.patch
          retention-days: 1
          overwrite: true

  codeql:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: CodeQL 보안 검사
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: CodeQL 보안 검사
        uses: ./.github/actions/codeql
