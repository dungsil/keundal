name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 빌드
        run: pnpm build

  typecheck:
    name: 타입 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 타입 검사에 필요한 패키지 빌드
        run: pnpm build

      - name: 타입 검사
        run: pnpm typecheck

  test:
    name: 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 테스트
        run: pnpm test

  lint:
    name: 린트 및 형식 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup

      - name: 린트 및 형식 검사
        run: pnpm lint
