name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_RUN_SUMMARY: 'true'

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: 변경사항 확인
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter가 PR의 변경 파일을 조회한다.
    outputs:
      source: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.source == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      # 설치 파일은 PR 프리뷰와 수동 실행에만 쓰이므로 push에서는 만들지 않는다.
      # 운영 배포는 웹 아티팩트만 사용하고, push 실행은 게시할 설치 파일이 없다.
      installers: ${{ github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true') }}
    steps:
      - name: 저장소 가져오기
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 변경 경로 확인
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.before || github.base_ref }}
          predicate-quantifier: every
          filters: |
            source:
              - '**'
              - '!docs/**'
              - '!examples/**'
              - '!*.md'
              - '!apps/*/README.md'
              - '!packages/*/README.md'
              - '!tools/*/README.md'
            web:
              - '**'
              - '!docs/**'
              - '!examples/**'
              - '!*.md'
              - '!apps/*/README.md'
              - '!packages/*/README.md'
              - '!tools/*/README.md'
              - '!apps/desktop/**'
            desktop:
              - '**'
              - '!docs/**'
              - '!examples/**'
              - '!*.md'
              - '!apps/*/README.md'
              - '!packages/*/README.md'
              - '!tools/*/README.md'
              - '!apps/web/**'

  build:
    name: 빌드
    needs: [changes, build-web, build-platforms]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 전체 빌드 결과 확인
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.changes.outputs.web != 'true' && (needs.changes.outputs.installers != 'true' && 'build-web,build-platforms' || 'build-web') || (needs.changes.outputs.installers != 'true' && 'build-platforms' || '') }}

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: 웹 및 패키지 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 개발 환경 준비 재시도
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Turbo 공유 캐시 설정
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: 패키지와 예제 빌드
        run: pnpm exec turbo run build --filter='!@keundal/web' --filter='!@keundal/desktop'

      - name: Workers 빌드
        run: pnpm exec turbo run build:cloudflare --filter=@keundal/web

      - name: Workers 빌드 아티팩트 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-workers
          overwrite: true
          path: apps/web/.output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Turbo 실행 요약 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

  build-platforms:
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    name: 빌드 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-2025
            name: windows-x64
            artifact-path: apps/desktop/src-tauri/target/release/portable
          - os: macos-15
            name: macos-arm64
            artifact-path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 개발 환경 준비 재시도
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Turbo 공유 캐시 설정
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-v4-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-v4-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Linux 빌드 의존성 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils
          echo "NATIVE_SYSTEM_DEPS=$(dpkg-query --show --showformat='${Package}=${Version};' libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils)" >> "$GITHUB_ENV"

      - name: Rust stable 설정
        id: rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust 빌드 캐시 설정
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-${{ matrix.name }}
          cache-bin: false

      - name: 데스크톱 설치 파일 빌드
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          RUSTC_CACHE_KEY: ${{ steps.rust.outputs.cachekey }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        with:
          command: pnpm exec turbo run build:native --filter=@keundal/desktop
          shell: bash
          timeout_minutes: 30
          retry_on: error
          # macOS의 hdiutil이 일시적으로 Resource busy를 반환하면 다시 시도한다.
          max_attempts: ${{ runner.os == 'macOS' && 3 || 1 }}

      - name: Windows 포터블 배포 파일 준비
        if: runner.os == 'Windows'
        run: |
          portable=apps/desktop/src-tauri/target/release/portable
          mkdir -p "$portable"
          cp apps/desktop/src-tauri/target/release/keundal-desktop.exe "$portable/"
          cp apps/desktop/src-tauri/binaries/keundal-host-x86_64-pc-windows-msvc.exe "$portable/keundal-host.exe"
          cp -R apps/desktop/src-tauri/sidecar "$portable/"

      - name: Windows 포터블 실행 검증
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'keundal portable smoke'
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $archive = Join-Path $smokeRoot 'portable.zip'
          $extracted = Join-Path $smokeRoot 'extracted app'
          Compress-Archive -Path 'apps/desktop/src-tauri/target/release/portable/*' -DestinationPath $archive -Force
          Expand-Archive -Path $archive -DestinationPath $extracted -Force
          & (Join-Path $extracted 'keundal-host.exe') 'apps/desktop/scripts/smoke-portable.mjs' $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Portable smoke test failed' }

      - name: 데스크톱 배포 파일 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          overwrite: true
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

      - name: Turbo 실행 요약 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

  typecheck:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 타입 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: 개발 환경 준비 재시도
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Turbo 공유 캐시 설정
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: 타입 검사
        env:
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
        run: |
          filters=()
          if [ "$WEB_CHANGED" != 'true' ]; then filters+=(--filter='!@keundal/web'); fi
          if [ "$DESKTOP_CHANGED" != 'true' ]; then filters+=(--filter='!@keundal/desktop'); fi
          pnpm exec turbo run typecheck "${filters[@]}"

      - name: Turbo 실행 요약 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

  test:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: 개발 환경 준비 재시도
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Turbo 공유 캐시 설정
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Lighthouse 예산 검사
        run: node --test tools/lighthouse/*.test.mjs

      - name: 테스트
        env:
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
        run: |
          filters=()
          if [ "$WEB_CHANGED" != 'true' ]; then filters+=(--filter='!@keundal/web'); fi
          if [ "$DESKTOP_CHANGED" != 'true' ]; then filters+=(--filter='!@keundal/desktop'); fi
          pnpm exec turbo run test "${filters[@]}"

      - name: Turbo 실행 요약 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

  browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: 브라우저 회귀 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 접근성 검사 목록 확인
        run: |
          node --test tools/a11y/*.test.mjs
          node tools/a11y/check.mjs

      - name: Chromium 설치
        run: pnpm --filter @keundal/web exec playwright install --with-deps chromium

      - name: 웹 빌드
        env:
          NITRO_PRESET: node-server
        run: pnpm exec turbo run build --filter=@keundal/web...

      - name: 브라우저 회귀 검사
        run: pnpm --filter @keundal/web test:browser --project=chromium

      - name: 브라우저 검사 보고서 보관
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: 린트 및 형식 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 개발 환경 준비 재시도
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 린트 및 형식 검사
        id: lint
        run: pnpm lint

      - name: 린트 및 형식 자동수정
        id: lintfix
        if: failure() && steps.lint.outcome == 'failure'
        run: pnpm lintfix

      - name: 수정 패치 생성
        id: patch
        if: >-
          !cancelled() &&
          contains(fromJSON('["success", "failure"]'), steps.lintfix.outcome)
        run: |
          git diff --binary --full-index > "$RUNNER_TEMP/autofix.patch"
          if [ -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: 수정 패치 업로드
        if: ${{ !cancelled() && steps.patch.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lintfix
          path: ${{ runner.temp }}/autofix.patch
          if-no-files-found: error
          retention-days: 1

  codeql:
    # 병합 규칙이 CodeQL 분석 결과를 요구하므로 변경 경로와 관계없이 실행한다.
    name: CodeQL 보안 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # CodeQL 분석 결과를 업로드한다.
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL 초기화
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript,actions

      - name: CodeQL 분석
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          # 주간 감사와 기존 main 분석이 같은 설정으로 비교되도록 유지한다.
          category: .github/workflows/ci.yml:codeql
