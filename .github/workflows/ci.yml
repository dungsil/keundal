name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'examples/**'
      - 'packages/**'
      - 'tools/**'
      - '!apps/**/*.md'
      - '!examples/**/*.md'
      - '!packages/**/*.md'
      - '!tools/**/*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'turbo.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # 프리뷰 종료 워크플로우와 그룹을 공유하여 배포와 삭제를 순서대로 실행한다.
  group: CI-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 변경사항 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ github.event_name != 'pull_request' || steps.filter.outputs.source == 'true' }}
    steps:
      # PR은 경로 확인을 항상 실행하여 문서 변경도 필수 검사 결과를 남긴다.
      - name: 변경 경로 확인
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            source:
              - '{apps,examples,packages,tools}/**/!(*.md)'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.github/workflows/**'
              - '.github/actions/**'
      - name: 전체 검사 선택
        if: github.event_name != 'pull_request'
        run: echo '전체 검사를 실행합니다.'

  build:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 빌드
        run: pnpm build

  build-platforms:
    needs: build
    name: 플랫폼 빌드 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: Linux 빌드 의존성 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils

      - name: Rust stable 설정
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Rust 빌드 캐시 설정
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-${{ matrix.name }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: 빌드
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm build:preview

      - name: Workers 빌드 아티팩트 업로드
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-workers
          path: apps/web/.output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: 데스크톱 설치 파일 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  typecheck:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 타입 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 타입 검사에 필요한 패키지 빌드
        run: pnpm build

      - name: 타입 검사
        run: pnpm typecheck

  test:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: 테스트
        run: pnpm test

  lint:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: 린트 및 형식 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup

      - name: 린트 및 형식 검사
        id: lint
        run: pnpm lint

      - name: 린트 및 형식 자동수정
        id: lintfix
        if: >-
          failure() && steps.lint.outcome == 'failure' &&
          ((github.event_name != 'pull_request' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref == github.event.repository.default_branch &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft))
        run: pnpm lintfix

      - name: PR 브랜치에 자동수정 반영
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          contains(fromJSON('["success", "failure"]'), steps.lintfix.outcome)
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::AUTOFIX_TOKEN이 필요합니다. Dependabot PR에서는 Dependabot secret에 등록해야 합니다.'
            exit 1
          fi
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style: 코드 스타일을 통일한다'
          gh auth setup-git
          # CI 이후 브랜치가 변경되었다면 푸시를 거절한다.
          git push --force-with-lease="refs/heads/$PR_BRANCH:$SOURCE_SHA" origin "HEAD:refs/heads/$PR_BRANCH"

      - name: 수정 패치 생성
        id: patch
        if: >-
          !cancelled() && github.event_name != 'pull_request' &&
          contains(fromJSON('["success", "failure"]'), steps.lintfix.outcome)
        run: |
          git diff --binary --full-index > "$RUNNER_TEMP/autofix.patch"
          if [ -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: 수정 패치 업로드
        if: ${{ !cancelled() && steps.patch.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lintfix
          path: ${{ runner.temp }}/autofix.patch
          retention-days: 1
          overwrite: true

  codeql:
    # 병합 규칙이 CodeQL 분석 결과를 요구하므로 변경 경로와 관계없이 실행한다.
    name: CodeQL 보안 검사
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: CodeQL 보안 검사
        uses: ./.github/actions/codeql

  deploy:
    name: 운영 배포
    needs: [build, build-platforms, typecheck, test, lint, codeql]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps: &deploy-steps
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup

      - name: Workers 빌드 아티팩트 내려받기
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-workers
          path: apps/web/.output

      - name: Workers 배포
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: >-
            ${{ github.event_name == 'pull_request' && format('preview --name pr-{0}', github.event.pull_request.number) || 'deploy' }}
            --config .output/server/wrangler.json

  preview-comment:
    name: PR 프리뷰 댓글 갱신
    needs: [deploy-preview, build-platforms]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.deploy-preview.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: 데스크톱 다운로드 링크 생성
        id: desktop
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100
            });
            const downloads = artifacts
              .filter(artifact => artifact.name.startsWith('desktop-') && !artifact.expired)
              .sort((a, b) => a.name.localeCompare(b.name))
              .map(artifact => {
                const name = artifact.name.slice('desktop-'.length);
                const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
                return `- [${name}](${url})`;
              });
            core.setOutput('downloads', downloads.join('\n') ||
              '다운로드할 수 있는 데스크톱 빌드가 없습니다. CI 실행 로그를 확인하세요.');

      - name: PR 프리뷰 댓글 갱신
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cloudflare-preview
          message: |
            ### PR 프리뷰

            ${{ needs.deploy-preview.outputs.preview-url && format('[웹 프리뷰 열기]({0})', needs.deploy-preview.outputs.preview-url) || '웹 프리뷰 URL이 설정되지 않았습니다.' }}

            #### 데스크톱 다운로드

            ${{ steps.desktop.outputs.downloads }}

            빌드 상태: `${{ needs.build-platforms.result }}`. 실패한 빌드는 CI 실행 로그를 확인하세요.

            다운로드에는 GitHub 로그인이 필요하며, 설치 파일은 업로드 후 7일간 보관합니다.
            코드 서명 인증서와 공증이 없는 테스트용 빌드이므로 OS 보안 경고가 표시될 수 있습니다.

            커밋: `${{ github.event.pull_request.head.sha }}`

            [CI 실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})

  deploy-preview:
    name: PR 프리뷰 배포
    needs: [build, build-platforms, typecheck, test, lint, codeql]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview-url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
    steps: *deploy-steps
