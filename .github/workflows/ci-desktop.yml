name: 데스크톱 CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    name: 데스크톱 프리뷰 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            bundles: deb,appimage
          - os: windows-2022
            name: windows-x64
            bundles: nsis
          - os: macos-15
            name: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            name: macos-x64
            bundles: dmg
    defaults:
      run:
        shell: bash
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        uses: ./.github/actions/setup
        with:
          turbo-cache: true

      - name: Linux 빌드 의존성 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils

      - name: Rust stable 설정
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Rust 빌드 캐시 설정
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-${{ matrix.name }}

      - name: 공유 패키지 빌드
        run: pnpm exec turbo run build --filter='@keundal/web^...'

      - name: 데스크톱 설치 파일 빌드
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm --filter @keundal/desktop bundle --bundles ${{ matrix.bundles }}

      - name: 데스크톱 설치 파일 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
          overwrite: true
