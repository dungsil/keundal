name: PR Lighthouse

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # 필수 검사가 항상 생성되도록 트리거에는 경로 필터를 두지 않는다.
    # UI 변경 여부는 changes 작업에서 판단한다.

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: UI 변경 확인
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter가 PR의 변경 파일을 조회한다.
    outputs:
      ui: ${{ github.event.pull_request.head.repo.full_name == github.repository && steps.filter.outputs.ui == 'true' }}
    steps:
      - name: 변경 경로 확인
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ui:
              - 'tools/lighthouse/**'
              - '.github/workflows/lighthouse.yml'
              - 'pnpm-lock.yaml'
              - 'apps/web/app/**'
              - 'apps/web/public/**'
              - 'apps/web/shared/**'
              - 'apps/web/nuxt.config.ts'
              - 'apps/web/package.json'
              - 'packages/chat-app/app/**'
              - 'packages/chat-app/public/**'
              - 'packages/ui-*/app/**'
              - 'packages/ui-*/nuxt.config.ts'
              - 'packages/ui-*/package.json'
              - 'packages/ui-slots/src/**'
              - 'packages/ui-runtime/src/**'
              - 'packages/chat-app/nuxt.config.ts'
              - 'packages/chat-app/package.json'
              - 'packages/ui/app/**'
              - 'packages/ui/public/**'
              - 'packages/ui/shared/**'
              - 'packages/ui/nuxt.config.ts'
              - 'packages/ui/package.json'

  preview:
    name: 현재 커밋의 프리뷰 배포 대기
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 배포된 프리뷰 URL 확인
        id: preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { findPreview } = await import(`${process.env.GITHUB_WORKSPACE}/tools/lighthouse/preview.mjs`);
            const source = context.payload.pull_request;
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: source.number
              });
              if (pr.state !== 'open' || pr.head.sha !== source.head.sha) {
                core.info('PR이 닫혔거나 최신 커밋이 변경되어 검사를 생략합니다.');
                return;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: source.number, per_page: 100
              });
              const url = findPreview(comments, source.head.sha);
              if (url) {
                core.setOutput('url', url);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            core.setFailed('현재 커밋의 프리뷰 배포를 20분 안에 확인하지 못했습니다.');

  lighthouse:
    name: 프리뷰 Lighthouse 검사
    needs: preview
    if: needs.preview.outputs.url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      report: ${{ steps.summary.outputs.report || steps.failure.outputs.report }}
    permissions:
      contents: read
    env:
      LIGHTHOUSE_BASE_URL: ${{ needs.preview.outputs.url }}
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: 검사 설정 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 개발 환경 준비 재시도
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 결과 요약 로직 검사
        run: node --test tools/lighthouse/*.test.mjs

      - name: 프리뷰 응답 대기
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 12 --retry-all-errors --retry-delay 5 --max-time 10
          "$LIGHTHOUSE_BASE_URL/"

      - name: 배포된 프리뷰를 Unlighthouse로 3회 측정
        run: |
          for sample in 1 2 3; do
            LIGHTHOUSE_RUN="$sample" pnpm dlx --allow-build=esbuild --allow-build=puppeteer --allow-build=vue-demi @unlighthouse/cli@0.19.1 --config-file tools/lighthouse/unlighthouse.config.mjs --site "$LIGHTHOUSE_BASE_URL"
          done

      - name: Lighthouse 결과 요약
        id: summary
        run: |
          LIGHTHOUSE_REPORT_DIR=.unlighthouse LIGHTHOUSE_RESULT_FILE="$RUNNER_TEMP/lighthouse-result" node tools/lighthouse/summary.mjs > "$RUNNER_TEMP/lighthouse-report.md"
          cat "$RUNNER_TEMP/lighthouse-report.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'report<<LIGHTHOUSE_REPORT'
            cat "$RUNNER_TEMP/lighthouse-report.md"
            echo 'LIGHTHOUSE_REPORT'
            echo "result=$(cat "$RUNNER_TEMP/lighthouse-result")"
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse 상세 보고서 보관
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.event.pull_request.head.sha }}
          path: .unlighthouse/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: 검사 오류 표시
        id: failure
        if: failure()
        run: |
          echo '::error::Lighthouse 검사를 완료하지 못했습니다. 점수를 확인하지 못했으므로 병합을 차단합니다.'
          report='Lighthouse 검사를 완료하지 못했습니다. 점수를 확인하지 못했으므로 병합을 차단합니다. 작업 로그를 확인하고 재실행하세요.'
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: 점수 기준 확인
        if: steps.summary.outputs.result != 'passed'
        run: |
          echo '::error::Lighthouse 점수 또는 CLS 예산을 초과한 항목이 있습니다. 작업 요약을 확인하세요.'
          exit 1

  lighthouse-gate:
    name: Lighthouse 점수 기준
    needs: [changes, preview, lighthouse]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lighthouse 검사 결과 확인
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # UI 변경이 없거나 외부 포크 PR이면 검사를 생략한다.
          # 검사 도중 PR이 닫히거나 커밋이 바뀌면 새 커밋의 실행이 검사를 담당한다.
          allowed-skips: ${{ needs.changes.outputs.ui != 'true' && 'preview,lighthouse' || (needs.preview.result == 'success' && needs.preview.outputs.url == '' && 'lighthouse' || '') }}

  lighthouse-comment:
    name: Lighthouse 결과 댓글 갱신
    needs: [changes, preview, lighthouse]
    if: ${{ always() && !cancelled() && needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: lighthouse-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: 댓글 대상 재확인
        id: target
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== context.payload.repository.full_name ||
                pr.head.sha !== context.payload.pull_request.head.sha) {
              core.info('PR이 닫혔거나 최신 커밋이 변경되어 댓글 갱신을 생략합니다.');
              return;
            }
            core.setOutput('ready', 'true');

      - name: Lighthouse 댓글 갱신
        if: steps.target.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ github.event.pull_request.number }}
          header: lighthouse-report
          message: |
            ${{ needs.lighthouse.outputs.report || 'Lighthouse 검사 결과를 생성하지 못했습니다. 작업 로그를 확인하세요.' }}

            커밋: `${{ github.event.pull_request.head.sha }}`

            [검사 실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})
