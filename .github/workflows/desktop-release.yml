name: Desktop signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable desktop version (MAJOR.MINOR.PATCH, without v)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  RELEASE_VERSION: ${{ inputs.version }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare development environment
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Retry development environment
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Require all signing and notarization credentials
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: node apps/desktop/scripts/release.mjs validate "$RELEASE_VERSION"
      - name: Test release tooling
        run: pnpm --filter @keundal/desktop exec vitest run tests/release.test.ts

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux-x64
          - os: windows-2025
            name: windows-x64
          - os: macos-15
            name: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare development environment
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Retry development environment
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Never restore unsigned preview bundle outputs into a release build.
      - name: Check native architecture
        env:
          RELEASE_PLATFORM: ${{ matrix.name }}
        run: |
          case "$RELEASE_PLATFORM" in
            linux-x64) triple=x86_64-unknown-linux-gnu ;;
            windows-x64) triple=x86_64-pc-windows-msvc ;;
            macos-arm64) triple=aarch64-apple-darwin ;;
          esac
          rustc -vV | grep -Fx "host: $triple"
      - name: Import Windows PFX certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./apps/desktop/scripts/release-windows.ps1 import
      - name: Create release-only Tauri configuration
        env:
          RELEASE_PLATFORM: ${{ matrix.name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WINDOWS_CERTIFICATE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: node apps/desktop/scripts/release.mjs config "$RELEASE_VERSION" "$RELEASE_PLATFORM" apps/desktop/src-tauri/release.conf.json
      - name: Prepare UI and sidecar without preview bundle caches
        run: pnpm --filter @keundal/desktop build:tauri
      - name: Sign external Windows host before bundling
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/scripts/release-windows.ps1 sign-host
      - name: Build signed release and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: pnpm --filter @keundal/desktop exec tauri build --config src-tauri/release.conf.json -- --locked
      - name: Verify Windows app, external host and installer signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/scripts/release-windows.ps1 verify
      - name: Verify macOS code signature and notarization ticket
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict apps/desktop/src-tauri/target/release/bundle/macos/Keundal.app
          xcrun stapler validate apps/desktop/src-tauri/target/release/bundle/macos/Keundal.app
      - name: Collect signed updater assets and installers
        env:
          RELEASE_PLATFORM: ${{ matrix.name }}
        run: node apps/desktop/scripts/release.mjs collect "$RELEASE_VERSION" "$RELEASE_PLATFORM" apps/desktop/src-tauri/target/release/bundle release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/scripts/release-windows.ps1 cleanup

  draft:
    needs: [validate, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare development environment
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Retry development environment
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Install updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets/linux-x64
          name: linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets/windows-x64
          name: windows-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets/macos-arm64
          name: macos-arm64
      - name: Validate complete manifest and create a new draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node apps/desktop/scripts/release.mjs draft "$RELEASE_VERSION" release-assets "$GITHUB_SHA"
