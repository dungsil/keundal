name: PR 프리뷰 배포

on:
  workflow_run:
    workflows: [PR 프리뷰 빌드, CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  source:
    name: 프리뷰 대상 확인
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.source.outputs.pr }}
    steps:
      - name: PR과 빌드 아티팩트 확인
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:${run.head_branch}`,
              per_page: 100
            });
            const pr = prs.find(pr =>
              pr.head.repo?.full_name === context.payload.repository.full_name &&
              pr.head.sha === run.head_sha
            );
            if (!pr) {
              core.info('최신 커밋이 일치하는 열린 PR이 없어 프리뷰를 생략합니다.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            if (!artifacts.some(artifact => artifact.name === 'cloudflare-workers' && !artifact.expired)) {
              core.info('배포할 Workers 빌드 아티팩트가 없어 프리뷰를 생략합니다.');
              return;
            }
            core.setOutput('pr', pr.number);

  deploy-preview:
    name: PR 프리뷰 배포
    needs: source
    if: needs.source.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      # 종료 워크플로우와 배포를 직렬화하고 대기 중인 삭제 요청을 보존한다.
      group: preview-${{ needs.source.outputs.pr }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Workers 빌드 아티팩트 내려받기
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-workers
          path: worker
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 프리뷰 배포 대상 재확인
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.source.outputs.pr }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== context.payload.repository.full_name ||
                pr.head.sha !== run.head_sha) {
              core.info('PR이 닫혔거나 배포 대상이 변경되어 프리뷰를 생략합니다.');
              return;
            }
            core.setOutput('ready', 'true');

      - name: Workers 프리뷰 배포
        id: deploy
        if: steps.source.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          workingDirectory: worker
          packageManager: npm
          command: >-
            preview --name pr-${{ needs.source.outputs.pr }}
            --config server/wrangler.json

      - name: 데스크톱 다운로드 링크 생성
        id: desktop
        if: steps.source.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sourceRun = context.payload.workflow_run;
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: sourceRun.head_sha,
              event: 'pull_request',
              status: 'success',
              per_page: 100
            });
            const run = data.workflow_runs.find(run =>
              run.head_repository?.full_name === context.payload.repository.full_name
            );
            if (!run) {
              core.setOutput('downloads',
                '데스크톱 빌드는 별도 CI에서 진행합니다. CI가 성공하면 다운로드 링크를 갱신합니다.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            const downloads = artifacts
              .filter(artifact => artifact.name.startsWith('desktop-') && !artifact.expired)
              .sort((a, b) => a.name.localeCompare(b.name))
              .map(artifact => {
                const name = artifact.name.slice('desktop-'.length);
                const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
                return `- [${name}](${url})`;
              });
            core.setOutput('downloads', downloads.join('\n') ||
              '다운로드할 수 있는 데스크톱 빌드가 없습니다. CI 실행 로그를 확인하세요.');

      - name: PR 프리뷰 댓글 갱신
        if: steps.source.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ needs.source.outputs.pr }}
          header: cloudflare-preview
          message: |
            ### PR 프리뷰

            ${{ steps.deploy.outputs.deployment-url && format('[웹 프리뷰 열기]({0})', steps.deploy.outputs.deployment-url) || '웹 프리뷰 URL이 설정되지 않았습니다.' }}

            #### 데스크톱 다운로드

            ${{ steps.desktop.outputs.downloads }}

            웹 빌드 상태: `success`.

            다운로드에는 GitHub 로그인이 필요하며, 배포 파일은 업로드 후 7일간 보관합니다.
            Windows는 압축을 모두 푼 뒤 `keundal-desktop.exe`를 실행합니다. 함께 들어 있는 호스트와 리소스, WebView2가 필요합니다.
            코드 서명 인증서와 공증이 없는 테스트용 빌드이므로 OS 보안 경고가 표시될 수 있습니다.

            커밋: `${{ github.event.workflow_run.head_sha }}`

            [빌드 실행 로그](${{ github.event.workflow_run.html_url }})

            Lighthouse 결과는 아래 프리뷰 배포 로그의 작업 요약과 `lighthouse-reports` 아티팩트에서 확인합니다.
            검사는 배포 후 실행되므로 결과가 표시되기까지 몇 분이 걸릴 수 있습니다.

            [프리뷰 배포 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})

  lighthouse:
    name: 프리뷰 Lighthouse 검사
    needs: deploy-preview
    if: needs.deploy-preview.outputs.url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    env:
      LIGHTHOUSE_BASE_URL: ${{ needs.deploy-preview.outputs.url }}
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      # workflow_run의 기본 브랜치 커밋을 사용하며 PR 코드를 실행하지 않는다.
      - name: 검사 설정 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 개발 환경 준비
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 결과 요약 로직 검사
        run: node --test tools/lighthouse/summary.test.mjs

      - name: 프리뷰 응답 대기
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 12 --retry-all-errors --retry-delay 5 --max-time 10
          "$LIGHTHOUSE_BASE_URL/"

      - name: Lighthouse 3회 측정
        run: pnpm dlx @lhci/cli@0.15.1 collect --config=tools/lighthouse/lighthouserc.cjs

      - name: Lighthouse 결과 요약
        run: node tools/lighthouse/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: 검사 오류 표시
        if: failure()
        run: |
          echo '::warning::Lighthouse 검사를 완료하지 못했습니다. 검사 로그와 보고서를 확인하세요.'
          echo 'Lighthouse 검사를 완료하지 못했습니다. 낮은 점수에 따른 실패가 아닙니다. 작업 로그와 보고서를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"

      - name: Lighthouse 보고서 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
