name: PR 프리뷰 빌드

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # preview.yml의 배포 대상 검사와 같은 제외 경로를 유지한다.
    # tools/tsdown과 tools/tsconfig는 앱 빌드 입력이므로 제외하지 않는다.
    paths-ignore:
      - 'apps/desktop/**'
      - 'ci/**'
      - 'docs/**'
      - 'examples/**'
      - 'tools/store-conformance/**'
      - '*.md'
      - 'apps/*/README.md'
      - 'packages/*/README.md'
      - 'tools/*/README.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_RUN_SUMMARY: 'true'

defaults:
  run:
    shell: bash

jobs:
  build-web:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: 웹 및 패키지 빌드
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 개발 환경 준비
        id: setup
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: 개발 환경 준비 재시도
        if: ${{ !cancelled() && steps.setup.outcome == 'failure' }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Turbo 공유 캐시 설정
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            turbo-js-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Workers 빌드
        run: pnpm exec turbo run build:cloudflare --filter=@keundal/web

      - name: Workers 빌드 아티팩트 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-workers
          overwrite: true
          path: apps/web/.output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Turbo 실행 요약 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
