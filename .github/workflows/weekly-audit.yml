name: 주간 보안 감사

on:
  schedule:
    - cron: '30 19 * * 0' # 한국 시간 매주 월요일 04:30
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL 주간 보안 감사
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # CodeQL 분석 결과를 업로드한다.
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: CodeQL 초기화
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript,actions

      - name: CodeQL 분석
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          # CI와 같은 category를 사용해 main 분석과 PR 분석을 연결한다.
          category: .github/workflows/ci.yml:codeql
