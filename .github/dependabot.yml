version: 2

updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - '유형:자동수정'
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Seoul

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
      - /.github/actions/codeql
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - '유형:자동수정'
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Seoul
