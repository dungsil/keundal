[package]
name = "keundal-desktop"
version = "0.1.0"
description = "Keundal desktop application"
authors = ["dungsil"]
edition = "2021"
license = "MIT"

[lib]
name = "keundal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"

[patch.crates-io]
glib = { git = "https://github.com/dungsil/gtk-rs-core.git", rev = "67a8aae85053f2649ff825847f6f5158dd89164a" }
